name: RAG Verifier Unified Release Qualification

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-integration.lock
      - name: Validate immutable supply chain
        run: python supply_chain_policy.py
      - name: Install pinned integration dependencies
        run: python install_locked_requirements.py requirements-integration.lock
      - name: Run unified release qualification
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python run_release_qualification.py \
            --manifest release_qualification_manifest.json \
            --output qualification-evidence/rag-v28-release.json
      - name: Retain unified release evidence
        if: always() && hashFiles('qualification-evidence/rag-v28-release.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rag-v28-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification-evidence/rag-v28-release.json
          if-no-files-found: error
          retention-days: 90
