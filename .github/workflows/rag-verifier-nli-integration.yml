name: RAG Verifier NLI Integration Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-nli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - name: Install pinned integration dependencies
        run: python -m pip install -r requirements-integration.txt
      - name: Run governed pinned NLI qualification
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: pytest -m nli_integration test_nli_qualification.py -v
