name: RAG Verifier NLI Integration Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-nli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - name: Install pinned integration dependencies
        run: python -m pip install -r requirements-integration.txt
      - name: Run governed pinned NLI qualification and capture evidence
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python run_nli_qualification.py \
            --manifest nli_deberta_qualification_v2.json \
            --output qualification-evidence/nli-deberta-v2.json
      - name: Retain qualification evidence
        if: always() && hashFiles('qualification-evidence/nli-deberta-v2.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: nli-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification-evidence/nli-deberta-v2.json
          if-no-files-found: error
          retention-days: 90
