name: RAG Verifier Unit Gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier-unit-tests:
    name: Deterministic verifier tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13.14"

      - name: Validate immutable supply chain
        run: python supply_chain_policy.py

      - name: Install deterministic test dependencies
        run: python install_locked_requirements.py requirements-ci.lock

      - name: Prove ML runtime is not imported
        run: |
          python - <<'PY'
          import sys

          from verifier import RAGVerifier
          from nli_provider import FakeNLIProvider
          from embedding_provider import FakeEmbeddingProvider
          from retriever import Retriever

          verifier = RAGVerifier(
              chunks={"x": "Evidence."},
              retrieved_ids={"x"},
              nli_provider=FakeNLIProvider()
          )

          retriever = Retriever(
              chunks={"x": "Evidence."},
              embedding_provider=FakeEmbeddingProvider(
                  {
                      "question": [1.0, 0.0],
                      "Evidence.": [1.0, 0.0]
                  }
              )
          )

          retriever.retrieve("question")

          assert "torch" not in sys.modules
          assert "transformers" not in sys.modules
          assert "sentence_transformers" not in sys.modules

          print("Deterministic verifier and retriever are ML-runtime independent.")
          PY

      - name: Run deterministic RAG gate
        run: python -m pytest -m "not integration" -v

      - name: Run RAG-V30 adversarial qualification
        run: |
          python run_adversarial_qualification.py \\
            --manifest adversarial_qualification_manifest.json \\
            --output qualification-evidence/rag-v30-adversarial.json
