name: RAG Verifier MiniLM Integration Gate

on:
  pull_request:
    paths:
      - "embedding_provider.py"
      - "healthcare_embedding_qualification.py"
      - "healthcare_qualification_manifest.py"
      - "healthcare_real_model_qualification.py"
      - "healthcare_minilm_qualification.json"
      - "test_healthcare_real_model_qualification.py"
      - "requirements-integration.txt"
      - ".github/workflows/rag-verifier-minilm-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-minilm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-integration.txt
      - name: Install pinned integration dependencies
        run: python -m pip install -r requirements-integration.txt
      - name: Run governed pinned MiniLM qualification
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: pytest -m integration test_healthcare_real_model_qualification.py -v
